name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation first. The best solution is often different from the first idea.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like the app to do?
    validations:
      required: false
