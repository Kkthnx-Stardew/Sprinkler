name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Test
        run: dotnet test tests/Sprinkler.Tests -c Release

      - name: Publish the single-file build
        run: dotnet publish src/Sprinkler -c Release -r ${{ matrix.rid }} -p:PublishSingleFile=true -o artifacts/publish

      - name: Smoke test the published program (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "artifacts/publish/Sprinkler.exe"
          if (-not (Test-Path $exe)) { throw "program missing" }
          $p = Start-Process $exe -ArgumentList "--version" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exited with code $($p.ExitCode)" }

      - name: Smoke test the published program (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x artifacts/publish/Sprinkler
          artifacts/publish/Sprinkler --version
          # a fake game folder: the check finds it, reads an empty Mods folder and exits without opening a window
          export SPRINKLER_DATA="$RUNNER_TEMP/sprinkler-data"
          game="$RUNNER_TEMP/Stardew Valley"
          mkdir -p "$SPRINKLER_DATA" "$game/Mods"
          : > "$game/Stardew Valley.dll"
          artifacts/publish/Sprinkler --check --game "$game" | tee check.txt
          grep -q "No updates." check.txt
