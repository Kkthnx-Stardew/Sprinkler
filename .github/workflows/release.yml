name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Check the tag matches the project version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match the project version v$version" }

      - name: Test
        run: dotnet test tests/Sprinkler.Tests -c Release

      - name: Publish
        run: dotnet publish src/Sprinkler -c Release -r ${{ matrix.rid }} -p:PublishSingleFile=true -o artifacts/publish

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "Sprinkler-$env:TAG-win-x64"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item artifacts/publish/Sprinkler.exe dist/
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File "$name.zip.sha256" -Encoding ascii

      - name: Package for Linux
        if: runner.os == 'Linux'
        run: |
          name="Sprinkler-$TAG-linux-x64"
          mkdir -p "dist/$name"
          cp artifacts/publish/Sprinkler "dist/$name/"
          chmod +x "dist/$name/Sprinkler"
          cp LICENSE THIRD-PARTY-NOTICES.md README.md "dist/$name/"
          tar -C dist -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: |
            Sprinkler-*.zip
            Sprinkler-*.tar.gz
            Sprinkler-*.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Release notes from the changelog
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = "(?s)## " + [regex]::Escape($version) + "[^\r\n]*\r?\n(.*?)(?=\r?\n## |\z)"
          $m = [regex]::Match($text, $pattern)
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See CHANGELOG.md." }
          $notes | Out-File release-notes.md -Encoding utf8

      - name: Sign the checksum files
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::UPDATE_SIGNING_KEY is not set. This release is not signed, so the app will only link to it and will not install it by itself."
            exit 0
          fi
          key="$RUNNER_TEMP/update-key.pem"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          embedded=$(grep -oP 'PublicKey = "\K[^"]+' src/Sprinkler.Core/SelfUpdate.cs)
          actual=$(openssl pkey -in "$key" -pubout -outform DER | base64 -w0)
          if [ "$embedded" != "$actual" ]; then
            rm -f "$key"
            echo "::error::The signing key does not match the public key built into the app (SelfUpdate.cs)."
            exit 1
          fi
          for f in packages/*.sha256; do
            openssl dgst -sha256 -sign "$key" -out "$f.sig" "$f"
          done
          rm -f "$key"
          ls packages

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" packages/* --title "Sprinkler $TAG" --notes-file release-notes.md $flags
