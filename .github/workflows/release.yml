name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Check the tag matches the project version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/StardewModUpdater/StardewModUpdater.csproj
          $version = $project.Project.PropertyGroup[0].Version
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match the project version v$version" }

      - name: Test
        run: dotnet test tests/StardewModUpdater.Tests -c Release

      - name: Publish
        run: dotnet publish src/StardewModUpdater -c Release -p:PublishSingleFile=true -o artifacts/publish

      - name: Package
        shell: pwsh
        run: |
          $name = "StardewModUpdater-$env:TAG-win-x64"
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item artifacts/publish/StardewModUpdater.exe dist/
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File "$name.zip.sha256" -Encoding ascii

      - name: Release notes from the changelog
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = "(?s)## " + [regex]::Escape($version) + "[^\r\n]*\r?\n(.*?)(?=\r?\n## |\z)"
          $m = [regex]::Match($text, $pattern)
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See CHANGELOG.md." }
          $notes | Out-File release-notes.md -Encoding utf8

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $name = "StardewModUpdater-$env:TAG-win-x64"
          $ghArgs = @('release', 'create', $env:TAG, "$name.zip", "$name.zip.sha256", '--title', "Stardew Mod Updater $env:TAG", '--notes-file', 'release-notes.md')
          if ($env:TAG -match '-') { $ghArgs += '--prerelease' }
          gh @ghArgs
