<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stardew Mod Updater</title>

<style>
@font-face { font-family: "Inter"; src: url("/inter.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root {
  color-scheme: light;
  --bg: #f6f7f9;
  --panel: #ffffff;
  --panel-2: #f3f4f6;
  --ink: #111827;
  --muted: #5b6475;
  --line: #e4e7ec;
  --accent: #15803d;
  --accent-hover: #166534;
  --accent-text: #166534;
  --accent-ink: #ffffff;
  --accent-soft: #e8f7ee;
  --info: #1d4ed8;
  --info-soft: #e8efff;
  --warn: #92400e;
  --warn-soft: #fef3c7;
  --bad: #b91c1c;
  --bad-soft: #fee2e2;
  --violet: #6d28d9;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.08);
  --shadow-lg: 0 12px 32px rgba(16,24,40,.18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1116; --panel: #151a21; --panel-2: #1b212a; --ink: #e8ecf1; --muted: #9aa4b2; --line: #262e39;
    --accent: #34c76b; --accent-text: #34c76b; --accent-hover: #4cd67d; --accent-ink: #052612; --accent-soft: #12301f;
    --info: #7aa7ff; --info-soft: #16264a; --warn: #f5b94f; --warn-soft: #3a2b0e; --bad: #ff7b7b; --bad-soft: #3d1618; --violet: #a78bfa;
    --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 12px 32px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1116; --panel: #151a21; --panel-2: #1b212a; --ink: #e8ecf1; --muted: #9aa4b2; --line: #262e39;
  --accent: #34c76b; --accent-text: #34c76b; --accent-hover: #4cd67d; --accent-ink: #052612; --accent-soft: #12301f;
  --info: #7aa7ff; --info-soft: #16264a; --warn: #f5b94f; --warn-soft: #3a2b0e; --bad: #ff7b7b; --bad-soft: #3d1618; --violet: #a78bfa;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 12px 32px rgba(0,0,0,.55);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-feature-settings: "cv11", "ss03"; -webkit-font-smoothing: antialiased;
}
a { color: var(--info); text-underline-offset: 2px; }
button, input { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; letter-spacing: -.01em; font-weight: 650; }
h2 { font-size: 17px; } h3 { font-size: 15px; margin-top: 18px; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 20px; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.px { image-rendering: pixelated; shape-rendering: crispEdges; }
.ic { display: inline-block; vertical-align: middle; flex: none; }
.ic-accent { color: var(--accent-text); } .ic-info { color: var(--info); } .ic-warn { color: var(--warn); } .ic-bad { color: var(--bad); } .ic-violet { color: var(--violet); } .ic-muted { color: var(--muted); }

/* ---------- top bar ---------- */
header.top { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 14px; padding-top: 12px; padding-bottom: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { width: 58px; height: 58px; border-radius: 14px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line)); display: grid; place-items: center; flex: none; }
.brand h1 { font-size: 18px; line-height: 1.2; white-space: nowrap; }
.brand .sub { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.bar .grow { flex: 1; }
.bar .right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 1px 9px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); font-size: 12.5px; font-weight: 550; color: var(--muted); }
.chip.ok { background: var(--accent-soft); color: var(--accent-text); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
button.chip { cursor: pointer; } button.chip:hover { border-color: var(--muted); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; font-size: 14px; cursor: pointer; box-shadow: var(--shadow); transition: background .12s, border-color .12s, transform .05s; white-space: nowrap; }
.btn:hover { background: var(--panel-2); border-color: color-mix(in srgb, var(--muted) 45%, var(--line)); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.primary .ic { color: inherit; }
.btn.big { height: 44px; padding: 0 20px; font-size: 15px; border-radius: 12px; }
.btn.slim { height: 30px; padding: 0 11px; font-size: 13px; box-shadow: none; }
.btn.icon { width: 36px; padding: 0; }
.link { background: none; border: 0; color: var(--info); cursor: pointer; padding: 0; font-weight: 600; font-size: inherit; }
.link:hover { text-decoration: underline; } .link.danger { color: var(--bad); }

/* ---------- tabs ---------- */
nav.tabs { display: flex; gap: 4px; margin: 18px 0 6px; border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
nav.tabs button { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border: 0; background: none; color: var(--muted); font-weight: 600; font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
nav.tabs button:hover { color: var(--ink); }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs .count { background: var(--accent); color: var(--accent-ink); border-radius: 99px; font-size: 11.5px; min-width: 20px; text-align: center; padding: 0 6px; font-weight: 700; }

/* ---------- panels ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin: 14px 0; box-shadow: var(--shadow); }
.panel > h2 { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.panel.center { text-align: center; padding: 40px 20px; }
.panel.center h2 { justify-content: center; margin-top: 10px; }
.banner { border-radius: 12px; padding: 12px 14px; margin: 12px 0; display: flex; gap: 12px; align-items: flex-start; border: 1px solid transparent; }
.banner.bad { background: var(--bad-soft); color: var(--bad); } .banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.info { background: var(--info-soft); color: var(--info); } .banner.ok { background: var(--accent-soft); color: var(--accent-text); }
.banner .grow { flex: 1; color: var(--ink); } .banner .grow strong { color: inherit; }
.banner .x { background: none; border: 0; cursor: pointer; font-size: 20px; line-height: 1; color: var(--muted); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 14px 0; }
.tile { display: flex; align-items: center; gap: 14px; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; cursor: pointer; box-shadow: var(--shadow); transition: border-color .12s, transform .05s; }
.tile:hover { border-color: color-mix(in srgb, var(--muted) 45%, var(--line)); }
.tile .dot { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--panel-2); flex: none; }
.tile .n { font-size: 24px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .l { font-size: 13px; color: var(--muted); }

.hero { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin: 14px 0; padding: 20px 22px; border-radius: 16px; border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--line)); background: linear-gradient(120deg, var(--accent-soft), var(--panel) 70%); box-shadow: var(--shadow); }
.hero-art { width: 88px; height: 88px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); display: grid; place-items: center; flex: none; box-shadow: var(--shadow); }
.hero-title { font-size: 22px; letter-spacing: -.02em; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; margin: 16px 0 0; font-size: 13px; font-weight: 600; }
.steps span { padding: 3px 12px; border-radius: 99px; background: var(--panel-2); color: var(--muted); }
.steps span.on { background: var(--accent-soft); color: var(--accent-text); }
.steps span.done { background: var(--panel-2); color: var(--ink); }

/* ---------- update cards ---------- */
.item { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; margin: 12px 0; box-shadow: var(--shadow); }
.item.done { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.item.failed { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
.item .head { display: flex; gap: 12px; align-items: center; padding: 14px 16px 6px; }
.item .art { width: 40px; height: 40px; border-radius: 12px; background: var(--panel-2); display: grid; place-items: center; flex: none; }
.item .name { font-weight: 650; font-size: 16px; line-height: 1.25; }
.item .ver { margin-left: auto; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
.item .ver b { color: var(--accent-text); background: var(--accent-soft); padding: 2px 9px; border-radius: 8px; font-weight: 650; }
.item .body { padding: 0 16px 14px 68px; }
.check { width: 20px; height: 20px; accent-color: var(--accent); flex: none; cursor: pointer; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 650; padding: 1px 8px; border-radius: 6px; background: var(--panel-2); color: var(--muted); vertical-align: middle; }
.tag.new { background: var(--info-soft); color: var(--info); } .tag.auto { background: var(--accent-soft); color: var(--accent-text); } .tag.click { background: var(--warn-soft); color: var(--warn); }
.sources { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 4px; }
.src { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 5px 10px; cursor: pointer; font-weight: 600; font-size: 13px; }
.src:hover { border-color: color-mix(in srgb, var(--muted) 45%, var(--line)); }
.src[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
.src:disabled { opacity: .5; cursor: not-allowed; text-decoration: line-through; }
.badge { width: 20px; height: 20px; border-radius: 6px; display: inline-grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; flex: none; }
.badge.Nexus { background: #e8802a; } .badge.CurseForge { background: #f16436; } .badge.GitHub { background: #3a3f4b; } .badge.ModDrop { background: #3b82c4; }
.note { font-size: 13px; color: var(--muted); margin: 3px 0; }
.wait { background: var(--warn-soft); border-radius: 12px; padding: 12px 14px; margin: 8px 0; display: flex; gap: 12px; }
.wait .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.wait .pointer { animation: bob 1.1s ease-in-out infinite alternate; }
@keyframes bob { from { transform: translateX(0) } to { transform: translateX(4px) } }
.bar-track { height: 8px; border-radius: 99px; background: var(--panel-2); overflow: hidden; margin: 8px 0; }
.bar-track > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .2s; }
.bar-track.indeterminate > i { width: 35% !important; animation: slide 1.1s ease-in-out infinite alternate; }
@keyframes slide { from { margin-left: 0 } to { margin-left: 65% } }
details > summary { cursor: pointer; color: var(--info); font-weight: 600; font-size: 13.5px; }
ul.clean { margin: 6px 0; padding-left: 20px; }
.actions-bar { position: sticky; bottom: 12px; z-index: 4; margin-top: 16px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); }
.actions-bar .grow { flex: 1; }

/* ---------- lists ---------- */
.tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
input[type=text], input[type=password], input[type=search] { width: 100%; height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
input:focus { border-color: var(--info); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--info) 22%, transparent); }
.tools input[type=search] { flex: 1; min-width: 200px; width: auto; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 3px 12px; font-weight: 600; font-size: 13px; color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent-text); }
.mtable { margin-top: 6px; }
.mhead, .mrow { display: grid; grid-template-columns: 52px minmax(0, 1.7fr) 96px minmax(0, 1.1fr) 36px; gap: 12px; align-items: center; }
.mhead { padding: 6px 4px; font-size: 12px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--line); }
.mrow { padding: 10px 4px; border-top: 1px solid var(--line); }
.mrow:hover { background: color-mix(in srgb, var(--panel-2) 60%, transparent); }
.mrow.is-off .mname, .mrow.is-off .mver { opacity: .6; }
.mrow .nm { font-weight: 600; } .mrow .meta { font-size: 13px; color: var(--muted); }
.mrow .needs { display: flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 600; color: var(--warn); margin-top: 2px; }
.mver { font-variant-numeric: tabular-nums; font-size: 14px; }
.mstatus { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.switch { position: relative; display: inline-block; width: 40px; height: 22px; cursor: pointer; justify-self: center; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .15s; pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(18px); }
.switch input:focus-visible + i { outline: 2px solid var(--info); outline-offset: 2px; }
.switch input:disabled + i { opacity: .5; }
.menu { position: relative; }
.menu summary { list-style: none; cursor: pointer; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); font-size: 20px; line-height: 1; }
.menu summary::-webkit-details-marker { display: none; }
.menu summary:hover, .menu[open] summary { background: var(--panel-2); color: var(--ink); }
.menu-list { position: absolute; right: 0; top: 34px; z-index: 6; min-width: 210px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; box-shadow: var(--shadow-lg); display: grid; }
.menu-list button { text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 14px; }
.menu-list button:hover { background: var(--panel-2); } .menu-list button.danger { color: var(--bad); }
select { height: 38px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; }
.tools .filters { margin: 0; }
.fieldrow { display: flex; gap: 8px; margin: 10px 0; }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; font-size: 14px; margin: 10px 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-all; }
.cands .btn { width: 100%; justify-content: flex-start; margin: 6px 0; height: 42px; }
.legend { display: grid; gap: 8px; margin-top: 8px; } .legend div { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.timeline { list-style: none; margin: 8px 0 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.helpgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.helpgrid .panel { margin: 0; }
.overlay { position: fixed; inset: 0; background: rgba(8,12,18,.55); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
.dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; max-width: 560px; width: 100%; padding: 22px; box-shadow: var(--shadow-lg); max-height: 90vh; overflow: auto; }
.dialog h2 { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.dialog .btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
.drop { position: fixed; inset: 0; z-index: 30; background: color-mix(in srgb, var(--accent) 88%, #000); color: #fff; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px; font-size: 22px; font-weight: 700; text-align: center; padding: 20px; }
.drop.on { display: flex; }
#toasts { position: fixed; right: 16px; bottom: 16px; z-index: 40; display: grid; gap: 8px; max-width: min(380px, calc(100vw - 32px)); }
.toast { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; box-shadow: var(--shadow-lg); animation: pop .16s ease-out; font-weight: 550; font-size: 14px; }
@keyframes pop { from { transform: translateY(8px); opacity: 0 } to { transform: none; opacity: 1 } }
.bob { animation: hop 1.2s ease-in-out infinite; display: inline-block; } @keyframes hop { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
.big-center { text-align: center; padding: 30px 16px; }
footer { text-align: center; color: var(--muted); font-size: 12px; padding: 30px 0 24px; }
.quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.qstep { display: flex; gap: 12px; align-items: flex-start; }
.qnum { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); font-weight: 750; display: grid; place-items: center; flex: none; }
.faq { border-top: 1px solid var(--line); padding: 10px 0; }
.faq:first-of-type { border-top: 0; }
.faq summary { color: var(--ink); font-weight: 600; font-size: 14.5px; }
.tour { text-align: center; max-width: 460px; }
.tour-art { width: 96px; height: 96px; margin: 4px auto 14px; border-radius: 24px; background: var(--accent-soft); display: grid; place-items: center; }
.dots { display: flex; gap: 6px; justify-content: center; margin: 18px 0 4px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); width: 22px; border-radius: 99px; }
footer a { color: var(--muted); }
@media (max-width: 640px) {
  .wrap { padding: 0 14px; }
  .item .body { padding-left: 16px; } .item .head { flex-wrap: wrap; } .item .ver { margin-left: 0; text-align: left; width: 100%; }
  .mhead { display: none; }
  .mrow { grid-template-columns: 44px minmax(0, 1fr) 32px; }
  .mrow .mver, .mrow .mstatus { grid-column: 2; }
  .mrow .menu { grid-column: 3; grid-row: 1; }
  .kv { grid-template-columns: 1fr; } .brand h1 { font-size: 16px; white-space: normal; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="drop" id="drop"><div id="dropicon"></div>Drop a mod .zip, .7z or .rar to install it</div>
<header class="top"><div class="wrap bar" id="topbar"></div></header>
<div class="wrap">
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  <main id="main" aria-live="polite"></main>
  <footer>Stardew Mod Updater <span id="appver"></span>. A fan-made tool, not affiliated with ConcernedApe, SMAPI or Nexus Mods.<br><span id="flinks"></span></footer>
</div>
<div id="modal"></div>
<div id="toasts" role="status" aria-live="polite"></div>

<script>
'use strict';
const q = new URLSearchParams(location.hash.slice(1));
let TOKEN = q.get('t') || sessionStorage.getItem('smu-token') || '';
if (q.get('t')) { sessionStorage.setItem('smu-token', TOKEN); history.replaceState(null, '', location.pathname); }

let S = null, tab = 'updates', lost = false, version = null, prevPhase = null;
const ui = { filter: 'all', sort: 'status', search: '', keyBusy: false, keyError: '', gamePathError: '', nxmNote: '', theme: 'auto' };
const themeFromUrl = q.get('theme');
if (q.get('tab')) tab = q.get('tab');
if (q.get('theme')) ui.theme = q.get('theme');
const wantTour = q.get('tour') === '1';
const skipTourFromUrl = q.get('notour') === '1';
applyTheme();

async function reportProblem() {
  const r = await api('diagnostics').catch(() => null);
  let copied = false;
  if (r && r.text) { try { await navigator.clipboard.writeText(r.text); copied = true; } catch {} }
  toast(copied ? 'Details copied. Paste them into the new issue.' : 'Opening the issue page.');
  openUrl(S.app.repo + '/issues/new');
}

// ---------------------------------------------------------------- quick tour
const TOUR = [
  ['chicken', 'Welcome to Stardew Mod Updater', 'It checks your mods against SMAPI\'s update list, shows what is out of date, and installs updates with a backup. This takes 30 seconds.'],
  ['package', '1. It checks for you', 'On launch the app reads your Mods folder and asks smapi.io which mods have newer versions. Nothing is changed during the check.'],
  ['arrowup', '2. You choose', 'Every update has a card. Tick the ones you want. The source buttons show where the file comes from, and "Automatic" ones need nothing from you.'],
  ['download', '3. Press Update', 'Mods that need a click open on Nexus a few at a time. When the file lands in Downloads, the app installs it. Every mod is backed up first.'],
  ['shield', 'Undo any time', 'History has an Undo button for every change. When you are done, press Play to start the game through SMAPI.'],
  ['key', 'Optional: connect Nexus', 'A free Nexus key lets the app pick the exact file and show what changed. With Premium it downloads by itself. You will find it under Nexus and settings.'],

function showTour(start = 0) {
  let i = start;
  const holder = el('div', { class: 'overlay' });
  const done = () => { post('prefs', { tourSeen: true }); holder.remove(); document.removeEventListener('keydown', onKey); };
  const draw = () => {
    const [icon, title, text] = TOUR[i];
    holder.replaceChildren(el('div', { class: 'dialog tour', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Quick tour' },
      el('div', { class: 'tour-art' }, px(icon, icon === 'chicken' ? 64 : 44)),
      el('h2', { style: 'justify-content:center;text-align:center' }, title),
      el('p', { class: 'muted', style: 'text-align:center;margin:8px 0 0' }, text),
      el('div', { class: 'dots' }, TOUR.map((_, n) => el('i', { class: n === i ? 'on' : '' }))),
      el('div', { class: 'btns', style: 'justify-content:space-between' },
        el('button', { class: 'btn', onclick: done }, i === TOUR.length - 1 ? 'Close' : 'Skip'),
        el('div', { style: 'display:flex;gap:8px' },
          i > 0 ? el('button', { class: 'btn', onclick: () => { i--; draw(); } }, 'Back') : null,
          el('button', { class: 'btn primary', onclick: () => { if (i === TOUR.length - 1) done(); else { i++; draw(); } } }, i === TOUR.length - 1 ? 'Done' : 'Next')))));
    holder.querySelector('.btn.primary').focus();
  };
  const onKey = e => { if (e.key === 'Escape') done(); else if (e.key === 'ArrowRight' && i < TOUR.length - 1) { i++; draw(); } else if (e.key === 'ArrowLeft' && i > 0) { i--; draw(); } };
  document.addEventListener('keydown', onKey);
  document.getElementById('modal').append(holder); draw();
}
let tourChecked = false;
function maybeTour() {
  if (tourChecked || !S || S.phase !== 'Review' || !S.welcomed) return;
  tourChecked = true;
  if (wantTour) { showTour(0); return; }
  const seen = S.settings.tourSeen ? '1' : '0';
  if (seen !== '1') showTour(0);
}

// ---------------------------------------------------------------- drag and drop
let dragDepth = 0;
const dropEl = document.getElementById('drop');
document.getElementById('dropicon').append(px('upload', 56));
window.addEventListener('dragenter', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) { dragDepth++; dropEl.classList.add('on'); } });
window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) dropEl.classList.remove('on'); });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', async e => {
  e.preventDefault(); dragDepth = 0; dropEl.classList.remove('on');
  for (const f of e.dataTransfer.files) {
    if (!/\.(zip|7z|rar)$/i.test(f.name)) { toast(f.name + ' is not a .zip, .7z or .rar file.', 'bad'); continue; }
    toast('Reading ' + f.name + '...');
    await fetch('/api/upload?name=' + encodeURIComponent(f.name), { method: 'POST', headers: { 'X-Token': TOKEN }, body: f });
  }
  tab = 'updates'; render();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render());
